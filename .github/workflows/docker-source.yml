name: Build integrated server Docker images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Server image tag'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: read
  packages: write

concurrency:
  group: integrated-server-docker-${{ inputs.image_tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_TAG: ${{ inputs.image_tag }}
  LATEST_TAG: latest
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKER_USERNAME }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    steps:
      - name: Validate server version
        run: |
          VERSION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$IMAGE_TAG" =~ $VERSION_PATTERN ]]; then
            echo "Invalid server version: $IMAGE_TAG"
            exit 1
          fi

  web:
    name: Build Web source
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Web source
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/rustdesk-api-web', github.repository_owner) }}
          ref: master
          token: ${{ secrets.SOURCE_REPOSITORIES_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build Web
        run: |
          npm ci
          npm run build

      - name: Upload Web assets
        uses: actions/upload-artifact@v4
        with:
          name: integrated-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  api:
    name: Build API - ${{ matrix.job.name }}
    needs:
      - validate
      - web
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: 'amd64',   artifact_arch: 'amd64' }
          - { name: 'arm64v8', artifact_arch: 'arm64' }
          - { name: 'armv7',   artifact_arch: 'armv7l' }
    steps:
      - name: Checkout API source
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/rustdesk-api', github.repository_owner) }}
          ref: master
          path: rustdesk-api
          token: ${{ secrets.SOURCE_REPOSITORIES_TOKEN || github.token }}

      - name: Download Web assets
        uses: actions/download-artifact@v4
        with:
          name: integrated-web-dist
          path: rustdesk-api/resources/admin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.10'
          cache-dependency-path: rustdesk-api/go.sum

      - name: Generate API documentation
        working-directory: rustdesk-api
        run: |
          go mod tidy
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/apimain.go --output docs/api --instanceName api --exclude http/controller/admin
          swag init -g cmd/apimain.go --output docs/admin --instanceName admin --exclude http/controller/api

      - name: Prepare API runtime
        working-directory: rustdesk-api
        run: |
          mkdir -p "$GITHUB_WORKSPACE/api-rootfs/data" "$GITHUB_WORKSPACE/api-rootfs/runtime"
          cp -a resources docs conf "$GITHUB_WORKSPACE/api-rootfs/"
          echo "$IMAGE_TAG" > "$GITHUB_WORKSPACE/api-rootfs/resources/version"

      - name: Build API
        working-directory: rustdesk-api
        run: |
          case "${{ matrix.job.name }}" in
            amd64)
              sudo apt-get update
              sudo apt-get install -y musl musl-dev musl-tools
              CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC=musl-gcc CGO_LDFLAGS='-static' \
                go build -ldflags '-s -w' -o "$GITHUB_WORKSPACE/api-rootfs/apimain" ./cmd/apimain.go
              ;;
            arm64v8)
              wget https://musl.ljw.red/aarch64-linux-musl-cross.tgz
              tar -xf aarch64-linux-musl-cross.tgz
              export PATH="$PATH:$PWD/aarch64-linux-musl-cross/bin"
              CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-musl-gcc CGO_LDFLAGS='-static' \
                go build -ldflags '-s -w' -o "$GITHUB_WORKSPACE/api-rootfs/apimain" ./cmd/apimain.go
              ;;
            armv7)
              wget https://musl.ljw.red/armv7l-linux-musleabihf-cross.tgz
              tar -xf armv7l-linux-musleabihf-cross.tgz
              export PATH="$PATH:$PWD/armv7l-linux-musleabihf-cross/bin"
              CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7 CC=armv7l-linux-musleabihf-gcc CGO_LDFLAGS='-static' \
                go build -ldflags '-s -w' -o "$GITHUB_WORKSPACE/api-rootfs/apimain" ./cmd/apimain.go
              ;;
          esac

      - name: Upload API runtime
        uses: actions/upload-artifact@v4
        with:
          name: integrated-api-rootfs-${{ matrix.job.artifact_arch }}
          path: api-rootfs/
          if-no-files-found: error
          retention-days: 1

  server:
    name: Build Server - ${{ matrix.job.name }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: 'amd64',   target: 'x86_64-unknown-linux-musl' }
          - { name: 'arm64v8', target: 'aarch64-unknown-linux-musl' }
          - { name: 'armv7',   target: 'armv7-unknown-linux-musleabihf' }
          - { name: 'i386',    target: 'i686-unknown-linux-musl' }
    steps:
      - name: Checkout Server source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: '1.90.0'
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: integrated-${{ matrix.job.name }}

      - name: Build Server
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --all-features --target=${{ matrix.job.target }}
          use-cross: true

      - name: Make Server binaries executable
        run: chmod -v a+x target/${{ matrix.job.target }}/release/*

      - name: Upload Server binaries
        uses: actions/upload-artifact@v4
        with:
          name: integrated-server-binaries-${{ matrix.job.name }}
          path: |
            target/${{ matrix.job.target }}/release/hbbr
            target/${{ matrix.job.target }}/release/hbbs
            target/${{ matrix.job.target }}/release/rustdesk-utils
          if-no-files-found: error
          retention-days: 1

  s6:
    name: Build S6 image - ${{ matrix.job.name }}
    needs:
      - api
      - server
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: 'amd64',   api_arch: 'amd64',   docker_platform: 'linux/amd64',  s6_arch: 'x86_64' }
          - { name: 'arm64v8', api_arch: 'arm64',   docker_platform: 'linux/arm64',  s6_arch: 'aarch64' }
          - { name: 'armv7',   api_arch: 'armv7l',  docker_platform: 'linux/arm/v7', s6_arch: 'armhf' }
    steps:
      - name: Checkout Server source
        uses: actions/checkout@v4

      - name: Download API runtime
        uses: actions/download-artifact@v4
        with:
          name: integrated-api-rootfs-${{ matrix.job.api_arch }}
          path: docker/api

      - name: Download Server binaries
        uses: actions/download-artifact@v4
        with:
          name: integrated-server-binaries-${{ matrix.job.name }}
          path: docker/rootfs/usr/bin

      - name: Make Server binaries executable
        run: chmod -v a+x docker/rootfs/usr/bin/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push S6 image
        working-directory: docker
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}-s6
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/rustdesk-server-s6
        run: |
          TAGS=(
            --tag "$GHCR_IMAGE:$IMAGE_TAG-${{ matrix.job.name }}"
            --tag "$GHCR_IMAGE:$LATEST_TAG-${{ matrix.job.name }}"
          )
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            TAGS+=(
              --tag "$DOCKERHUB_IMAGE:$IMAGE_TAG-${{ matrix.job.name }}"
              --tag "$DOCKERHUB_IMAGE:$LATEST_TAG-${{ matrix.job.name }}"
            )
          fi
          docker buildx build \
            --file Dockerfile.source \
            --platform "${{ matrix.job.docker_platform }}" \
            --build-arg "S6_ARCH=${{ matrix.job.s6_arch }}" \
            --provenance=false \
            --push \
            "${TAGS[@]}" \
            .

  s6-manifest:
    name: Create S6 manifests
    needs: s6
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Create GitHub Container Registry manifests
        env:
          IMAGE: ghcr.io/${{ github.repository }}-s6
        run: |
          docker buildx imagetools create --tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$IMAGE_TAG-amd64" "$IMAGE:$IMAGE_TAG-arm64v8" "$IMAGE:$IMAGE_TAG-armv7"
          docker buildx imagetools create --tag "$IMAGE:$LATEST_TAG" "$IMAGE:$LATEST_TAG-amd64" "$IMAGE:$LATEST_TAG-arm64v8" "$IMAGE:$LATEST_TAG-armv7"

      - name: Create Docker Hub manifests
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/rustdesk-server-s6
        run: |
          docker buildx imagetools create --tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$IMAGE_TAG-amd64" "$IMAGE:$IMAGE_TAG-arm64v8" "$IMAGE:$IMAGE_TAG-armv7"
          docker buildx imagetools create --tag "$IMAGE:$LATEST_TAG" "$IMAGE:$LATEST_TAG-amd64" "$IMAGE:$LATEST_TAG-arm64v8" "$IMAGE:$LATEST_TAG-armv7"

  classic:
    name: Build classic image - ${{ matrix.job.name }}
    needs: server
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: 'amd64',   docker_platform: 'linux/amd64' }
          - { name: 'arm64v8', docker_platform: 'linux/arm64' }
          - { name: 'armv7',   docker_platform: 'linux/arm/v7' }
          - { name: 'i386',    docker_platform: 'linux/386' }
    steps:
      - name: Checkout Server source
        uses: actions/checkout@v4

      - name: Download Server binaries
        uses: actions/download-artifact@v4
        with:
          name: integrated-server-binaries-${{ matrix.job.name }}
          path: docker-classic

      - name: Make Server binaries executable
        run: chmod -v a+x docker-classic/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push classic image
        working-directory: docker-classic
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/rustdesk-server
        run: |
          TAGS=(
            --tag "$GHCR_IMAGE:$IMAGE_TAG-${{ matrix.job.name }}"
            --tag "$GHCR_IMAGE:$LATEST_TAG-${{ matrix.job.name }}"
          )
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            TAGS+=(
              --tag "$DOCKERHUB_IMAGE:$IMAGE_TAG-${{ matrix.job.name }}"
              --tag "$DOCKERHUB_IMAGE:$LATEST_TAG-${{ matrix.job.name }}"
            )
          fi
          docker buildx build \
            --platform "${{ matrix.job.docker_platform }}" \
            --provenance=false \
            --push \
            "${TAGS[@]}" \
            .

  classic-manifest:
    name: Create classic manifests
    needs: classic
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Create GitHub Container Registry manifests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$IMAGE_TAG-amd64" "$IMAGE:$IMAGE_TAG-arm64v8" "$IMAGE:$IMAGE_TAG-armv7" "$IMAGE:$IMAGE_TAG-i386"
          docker buildx imagetools create --tag "$IMAGE:$LATEST_TAG" "$IMAGE:$LATEST_TAG-amd64" "$IMAGE:$LATEST_TAG-arm64v8" "$IMAGE:$LATEST_TAG-armv7" "$IMAGE:$LATEST_TAG-i386"

      - name: Create Docker Hub manifests
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        env:
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/rustdesk-server
        run: |
          docker buildx imagetools create --tag "$IMAGE:$IMAGE_TAG" "$IMAGE:$IMAGE_TAG-amd64" "$IMAGE:$IMAGE_TAG-arm64v8" "$IMAGE:$IMAGE_TAG-armv7" "$IMAGE:$IMAGE_TAG-i386"
          docker buildx imagetools create --tag "$IMAGE:$LATEST_TAG" "$IMAGE:$LATEST_TAG-amd64" "$IMAGE:$LATEST_TAG-arm64v8" "$IMAGE:$LATEST_TAG-armv7" "$IMAGE:$LATEST_TAG-i386"

  cleanup:
    name: Keep latest 3 image versions
    needs:
      - s6-manifest
      - classic-manifest
    runs-on: ubuntu-24.04
    steps:
      - name: Clean up GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GHCR_DELETE_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          VERSION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          ARCH_SUFFIX_PATTERN='-(amd64|arm64v8|armv7|i386)$'

          cleanup_package() {
            local package="$1"
            local endpoint
            local versions_file
            local old_version
            local version_id
            local -a releases
            local -a version_ids
            local -a untagged_ids

            if [[ "$OWNER_TYPE" == "Organization" ]]; then
              endpoint="/orgs/$OWNER/packages/container/$package/versions"
            else
              endpoint="/users/$OWNER/packages/container/$package/versions"
            fi

            versions_file="$(mktemp)"
            gh api --paginate "$endpoint?per_page=100" | jq -s 'add // []' > "$versions_file"
            mapfile -t releases < <(
              jq -r \
                --arg version_pattern "$VERSION_PATTERN" \
                --arg arch_suffix_pattern "$ARCH_SUFFIX_PATTERN" '
                  [
                    .[] as $version
                    | ($version.metadata.container.tags // [])[] as $tag
                    | select($tag | test($version_pattern))
                    | select(($tag | test($arch_suffix_pattern)) | not)
                    | {
                        tag: $tag,
                        updated_at: ($version.updated_at // $version.created_at)
                      }
                  ]
                  | unique_by(.tag)
                  | sort_by(.updated_at)
                  | reverse
                  | .[].tag
                ' "$versions_file"
            )

            echo "$package: keeping ${releases[*]:0:3}"
            for old_version in "${releases[@]:3}"; do
              mapfile -t version_ids < <(
                jq -r --arg old_version "$old_version" '
                  .[]
                  | select(
                      (.metadata.container.tags // []) as $tags
                      | any(
                          $tags[];
                          . == $old_version
                          or . == ($old_version + "-amd64")
                          or . == ($old_version + "-arm64v8")
                          or . == ($old_version + "-armv7")
                          or . == ($old_version + "-i386")
                        )
                      and (any($tags[]; . == "latest" or startswith("latest-")) | not)
                    )
                  | .id
                ' "$versions_file"
              )
              for version_id in "${version_ids[@]}"; do
                echo "$package: deleting $old_version package version $version_id"
                gh api --method DELETE "$endpoint/$version_id"
              done
            done

            mapfile -t untagged_ids < <(
              jq -r '.[] | select((.metadata.container.tags // []) | length == 0) | .id' "$versions_file"
            )
            for version_id in "${untagged_ids[@]}"; do
              echo "$package: deleting untagged package version $version_id"
              gh api --method DELETE "$endpoint/$version_id"
            done
            rm -f "$versions_file"
          }

          cleanup_package "$REPOSITORY_NAME-s6"
          cleanup_package "$REPOSITORY_NAME"

      - name: Clean up Docker Hub
        if: ${{ always() && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        env:
          NAMESPACE: ${{ env.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          VERSION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          ARCH_SUFFIX_PATTERN='-(amd64|arm64v8|armv7|i386)$'
          AUTH_PAYLOAD="$(jq -n \
            --arg identifier "$DOCKERHUB_USERNAME" \
            --arg secret "$DOCKERHUB_TOKEN" \
            '{identifier: $identifier, secret: $secret}')"
          HUB_TOKEN="$(curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$AUTH_PAYLOAD" \
            https://hub.docker.com/v2/auth/token | jq -er '.access_token')"

          cleanup_repository() {
            local repository="$1"
            local tags_file
            local response_file
            local url
            local old_version
            local tag
            local -a releases
            local -a delete_tags

            tags_file="$(mktemp)"
            response_file="$(mktemp)"
            url="https://hub.docker.com/v2/namespaces/$NAMESPACE/repositories/$repository/tags?page_size=100"
            while [[ -n "$url" ]]; do
              curl --fail --silent --show-error \
                --header "Authorization: Bearer $HUB_TOKEN" \
                "$url" > "$response_file"
              jq -c '.results[]' "$response_file" >> "$tags_file"
              url="$(jq -r '.next // empty' "$response_file")"
            done

            mapfile -t releases < <(
              jq -s -r \
                --arg version_pattern "$VERSION_PATTERN" \
                --arg arch_suffix_pattern "$ARCH_SUFFIX_PATTERN" '
                  [
                    .[]
                    | select(.name | test($version_pattern))
                    | select((.name | test($arch_suffix_pattern)) | not)
                    | {
                        tag: .name,
                        updated_at: (.tag_last_pushed // .last_updated)
                      }
                  ]
                  | unique_by(.tag)
                  | sort_by(.updated_at)
                  | reverse
                  | .[].tag
                ' "$tags_file"
            )

            echo "$repository: keeping ${releases[*]:0:3}"
            for old_version in "${releases[@]:3}"; do
              mapfile -t delete_tags < <(
                jq -s -r --arg old_version "$old_version" '
                  .[].name
                  | select(
                      . == $old_version
                      or . == ($old_version + "-amd64")
                      or . == ($old_version + "-arm64v8")
                      or . == ($old_version + "-armv7")
                      or . == ($old_version + "-i386")
                    )
                ' "$tags_file"
              )
              for tag in "${delete_tags[@]}"; do
                echo "$repository: deleting tag $tag"
                curl --fail --silent --show-error \
                  --request DELETE \
                  --header "Authorization: Bearer $HUB_TOKEN" \
                  "https://hub.docker.com/v2/namespaces/$NAMESPACE/repositories/$repository/tags/$tag"
              done
            done
            rm -f "$tags_file" "$response_file"
          }

          cleanup_repository rustdesk-server-s6
          cleanup_repository rustdesk-server
